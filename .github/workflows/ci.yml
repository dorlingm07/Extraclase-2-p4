name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter (ESLint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm test

      - name: Subir reporte de cobertura como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Notificar resultado del pipeline en el resumen del job
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### CI exitoso: el build, el lint y las pruebas pasaron correctamente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CI fallido: revisar los logs del job para identificar el paso que fallo." >> "$GITHUB_STEP_SUMMARY"
          fi
